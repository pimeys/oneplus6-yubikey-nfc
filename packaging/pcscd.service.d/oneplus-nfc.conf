[Unit]
Requires=oneplus-nfc-init.service
After=oneplus-nfc-init.service

[Service]
# pcscd --auto-exit unlinks the systemd-owned activation socket on this build.
ExecStart=
ExecStart=/usr/sbin/pcscd --foreground $PCSCD_ARGS
AmbientCapabilities=CAP_NET_ADMIN
CapabilityBoundingSet=CAP_NET_ADMIN
# NFC generic-netlink checks CAP_NET_ADMIN in the host user namespace.
PrivateUsers=false
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_NFC
